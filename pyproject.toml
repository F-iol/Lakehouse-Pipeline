[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-pipeline"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-athena-community>=1.11.0",
    "faker>=40.36.0",
    "kafka-python>=3.0.10",
    "pyspark==3.5.8",
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
